[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attentionseekers"
version = "0.1.0"
description = "Reproducible head extraction and localization for user-induced persona research"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==2.1.2", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
model = ["torch==2.4.1", "transformers==4.56.1", "accelerate==1.10.1"]
test = ["pytest>=8,<9"]

[dependency-groups]
model = ["torch==2.4.1", "transformers==4.56.1", "accelerate==1.10.1"]
dev = ["pytest>=8,<9"]
ws3 = ["openai>=1.40,<3", "scipy>=1.11,<2"]

[tool.uv]
default-groups = ["model", "dev", "ws3"]

[project.scripts]
ws2 = "attentionseekers.cli:main"

[tool.setuptools.packages.find]
where = ["Workstream_2", "Workstream_3"]
include = ["attentionseekers*", "ws3*"]

[tool.pytest.ini_options]
testpaths = ["Workstream_2/tests", "Workstream_3/tests"]
pythonpath = ["Workstream_2", "Workstream_3"]
